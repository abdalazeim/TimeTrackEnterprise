name: generic_template
description: Generic Android app template — Flutter + Clean Architecture + Offline-First + RTL support.
publish_to: "none"
version: 4.1.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.5
  path: ^1.9.0
  uuid: ^4.6.0
  go_router: ^14.8.1
  shared_preferences: ^2.3.3
  network_info_plus: ^6.1.1
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  clipboard: ^0.1.3
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
