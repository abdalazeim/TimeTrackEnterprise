# TimeTrack Enterprise - Nginx reverse proxy.
#
# Mounted by deployment/docker/docker-compose.yml at
# /etc/nginx/conf.d/default.conf.
#
# TLS certificates are read from /etc/nginx/certs:
#   fullchain.pem   certificate + intermediate chain
#   privkey.pem     private key
#
# For a quick test deployment generate a self-signed pair (browsers will warn):
#   openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#     -keyout deployment/nginx/certs/privkey.pem \
#     -out deployment/nginx/certs/fullchain.pem \
#     -subj "/CN=attendance.local"
#
# In production use a real certificate (Let's Encrypt, internal CA, ...).

upstream timetrack {
    server web:8000;
    keepalive 16;
}

# Long-poll for the scanner bridge and large XLSX exports.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let the ACME client validate a certificate before the redirect exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Django already sends HSTS; keeping it here as well covers error pages
    # generated by Nginx itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Student photos, logos and imported spreadsheets (30 MiB application cap).
    client_max_body_size 30m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;

    # Collected by ``manage.py collectstatic`` inside the web container and
    # shared through the ``static_files`` volume.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /health/ {
        proxy_pass http://timetrack;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://timetrack;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Scanner polling and report generation can take longer than the
        # default 60 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
