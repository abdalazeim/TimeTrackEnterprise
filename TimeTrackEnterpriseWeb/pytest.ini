[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_* *_test
testpaths = tests
norecursedirs = e2e migrations static media staticfiles .venv build dist
addopts = -q --strict-markers
markers =
    unit: pure service/unit tests
    integration: exercise the HTTP stack and the database
    e2e: browser/desktop end-to-end scenarios (see tests/e2e/README.md)
filterwarnings =
    ignore::DeprecationWarning:django.*
